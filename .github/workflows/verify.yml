name: Verify research publication
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s research/pilot/tests
      - name: Check original teaching fixture
        working-directory: docs/examples/shop
        run: python -m unittest test_shop
      - run: python research/pilot/verify.py
      - run: python research/pilot/verify_selection.py
      - run: python research/pilot/verify_probe_result.py
      - run: python research/pilot/verify_results.py
      - run: python research/pilot/score_results.py --check
      - run: python research/pilot/score_budget_supplement.py --check
      - run: python research/pilot/verify_global.py --check
      - run: python research/pilot/analyze_failure_chains.py --check
      - run: python research/pilot/verify_code_prompt.py
      - run: python research/pilot/diagnose_code_prompt_schema.py --check
      - run: python research/pilot/diagnose_code_prompt_schema.py --event 1091 --check
      - run: python research/pilot/diagnose_code_prompt_quotes.py --check
      - run: python research/pilot/verify_code_prompt_completed.py
      - run: python research/pilot/evaluate_code_prompt.py check
      - run: python research/pilot/analyze_code_prompt.py --check
      - run: python research/pilot/complete_code_prompt_evaluation.py --check
      - run: python research/pilot/strategy-routing/verify.py
      - run: python -m unittest discover -s research/pilot/strategy-routing/runtime/tests
      - run: python research/pilot/strategy-routing/runtime/verify_runtime.py
      - run: python research/pilot/verify_feature_results.py
      - run: python scripts/validate.py
