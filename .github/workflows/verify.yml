name: Verify research publication
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Check original teaching fixture
        working-directory: docs/examples/shop
        run: python -m unittest test_shop
      - run: python research/pilot/verify.py
      - run: python research/pilot/verify_selection.py
      - run: python scripts/validate.py
