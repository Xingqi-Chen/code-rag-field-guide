# Microsoft GraphRAG v3.3.0, commit 5faaaf4f5685fa2056fa8c3bf9342cb089f2942f.
# SELECTED MODELS ONLY. Not runnable: third-party endpoint/compatibility unresolved.
# Generation host: one.fullstar.tech; OpenAI-compatible adapter is an untested candidate.
# No real credentials belong in this file; see credentials.md.
# The frozen original template remains unchanged; this is a later selection addendum.
# This full-index template does NOT implement the bounded 8-chunk probe. See probe.md.
# Candidate call_args are statically prepared, not tested against either endpoint.
# All paths are relative to a dedicated run root, not to this template file.

completion_models:
  default_completion_model:
    type: litellm
    model_provider: "openai"
    model: "gpt-5.6-luna"
    auth_method: api_key
    api_key: "${CODE_RAG_FULLSTAR_API_KEY}"
    api_base: "<UNVERIFIED_ONE_FULLSTAR_API_BASE>"
    call_args:
      max_completion_tokens: 2048
      timeout: 60
      num_retries: 0
      drop_params: false
    retry:
      type: exponential_backoff
      max_retries: 0
    metrics:
      type: default
      store: memory
      writer: file
      base_dir: metrics/completion

embedding_models:
  default_embedding_model:
    type: litellm
    model_provider: "openai"
    model: "text-embedding-3-large"
    auth_method: api_key
    api_key: "${CODE_RAG_OPENAI_API_KEY}"
    api_base: "https://api.openai.com/v1"
    call_args:
      dimensions: 3072
      timeout: 30
      num_retries: 0
      drop_params: false
    retry:
      type: exponential_backoff
      max_retries: 0
    metrics:
      type: default
      store: memory
      writer: file
      base_dir: metrics/embedding

# A cautious pilot setting, not the upstream concurrency default.
concurrent_requests: 1

input:
  type: jsonl
  file_pattern: '.*\.jsonl$'
  encoding: utf-8
  id_column: id
  title_column: title
  text_column: text

# SHARED INPUT ADAPTATION, not untouched upstream document chunking:
# every JSONL row is already a complete-line chunk of <=1200 o200k_base tokens.
# Its producer supplies <=100 tokens of whole-line overlap between rows.
# Do not add a second overlap or append provenance to the model-visible text.
chunking:
  type: tokens
  size: 1200
  overlap: 0
  encoding_model: o200k_base
  prepend_metadata: null

input_storage:
  type: file
  base_dir: input
output_storage:
  type: file
  base_dir: output
update_output_storage:
  type: file
  base_dir: update-output
reporting:
  type: file
  base_dir: logs
cache:
  type: json
  storage:
    type: file
    base_dir: cache
vector_store:
  type: lancedb
  db_uri: output/lancedb
  # User-selected default dimension; verify actual endpoint output before indexing.
  vector_size: 3072

# Explicit upstream Standard order. workflows overrides the selected method;
# passing method=fast while retaining this list will NOT select FastGraphRAG.
# These steps include completion and embedding work if actually executed.
workflows:
  - load_input_documents
  - create_base_text_units
  - create_final_documents
  - extract_graph
  - finalize_graph
  - extract_covariates
  - create_communities
  - create_final_text_units
  - create_community_reports
  - generate_text_embeddings

# Upstream extraction types and embedded default prompts are unchanged.
extract_graph:
  completion_model_id: default_completion_model
  prompt: null
  entity_types: [organization, person, geo, event]
  max_gleanings: 1
summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: null
  max_length: 500
extract_claims:
  enabled: false
  completion_model_id: default_completion_model
cluster_graph:
  max_cluster_size: 10
  use_lcc: true
community_reports:
  completion_model_id: default_completion_model
  graph_prompt: null
  text_prompt: null
  max_length: 2000
  max_input_length: 8000
embed_text:
  embedding_model_id: default_embedding_model
  names: [entity_description, community_full_content, text_unit_text]
snapshots:
  graphml: false
  embeddings: false

# These blocks do not disable answer generation in the public search APIs.
# A context-only runner must call the internal builders described in interfaces.md.
basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: null
  k: 10
  max_context_tokens: 12000
local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: null
  text_unit_prop: 0.5
  community_prop: 0.15
  top_k_entities: 10
  top_k_relationships: 10
  max_context_tokens: 12000
